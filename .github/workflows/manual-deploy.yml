name: manual-deploy.yml

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Check dist directory
        run: |
          echo "=== 检查 dist 目录 ==="
          if [ -d "dist" ]; then
            echo "✅ dist 目录存在"
            echo "文件列表:"
            find dist/ -type f | head -10
          else
            echo "❌ dist 目录不存在"
            exit 1
          fi

      - name: Setup SSH Connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # 清理并重新设置 SSH
          rm -rf ~/.ssh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 写入私钥
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # 获取新的主机指纹
          echo "获取主机指纹..."
          ssh-keyscan -H ${{ secrets.VPS_HOST }} > ~/.ssh/known_hosts
          
          # 测试连接
          echo "测试 SSH 连接..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes \
              -o PasswordAuthentication=no \
              -o ConnectTimeout=10 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH 测试成功！' && whoami"

      - name: Deploy to VPS
        run: |
          echo "开始部署..."
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -o IdentitiesOnly=yes \
                -o PasswordAuthentication=no" \
            --delete \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_SITE_PATH }}
          
          echo "✅ 部署完成！"
